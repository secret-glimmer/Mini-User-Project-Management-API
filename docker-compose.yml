services:
  db:
    image: postgres:16-alpine
    container_name: mini_api_db
    environment:
      POSTGRES_DB: mini_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: mini_api_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mini_api
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
